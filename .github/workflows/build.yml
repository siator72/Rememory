name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Rememory.slnx -t:Restore -p:RestorePackagesConfig=true -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: msbuild Rememory\Rememory.csproj -t:Publish -p:Configuration=Release -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=win-${{ matrix.platform }}

      - name: Zip output
        shell: pwsh
        run: |
          $dir = "Rememory\bin\${{ matrix.platform }}\Release\net10.0-windows10.0.26100.0\win-${{ matrix.platform }}\publish"
          if (-not (Test-Path $dir)) { Get-ChildItem -Recurse Rememory\bin | Select-Object -ExpandProperty FullName; exit 1 }
          Compress-Archive -Path "$dir\*" -DestinationPath "Rememory-win-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Rememory-win-${{ matrix.platform }}
          path: Rememory-win-${{ matrix.platform }}.zip
